name: Build NOVA Browser APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Persist Consistent Signing Keystore (Enables In-Place Updates)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nova-browser-persistent-keystore-v1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NOVA-Browser-v4.5.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Browser-Debug-APK
          path: app/build/outputs/apk/debug/NOVA-Browser-v4.5.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.5.${{ github.run_number }}
          name: "NOVA Browser v4.5 (Build #${{ github.run_number }})"
          body: "NOVA Browser v4.5 — Clean UI Edition by Shah Alam Laskar. Tap NOVA-Browser-v4.5.apk below under Assets to download."
          files: app/build/outputs/apk/debug/NOVA-Browser-v4.5.apk
