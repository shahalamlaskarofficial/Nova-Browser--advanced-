name: Build NOVA Browser APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NOVA-Browser-v3.0.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Browser-Debug-APK
          path: app/build/outputs/apk/debug/NOVA-Browser-v3.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "NOVA Browser v3.0 (Build #${{ github.run_number }})"
          body: "Automated build of NOVA Browser v3.0 by Shah Alam Laskar. Tap NOVA-Browser-v3.0.apk below under Assets to download directly."
          files: app/build/outputs/apk/debug/NOVA-Browser-v3.0.apk
